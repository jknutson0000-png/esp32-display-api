; PwnDeck — ESP32 red-team firmware
; Primary target: ESP32-2432S028 (Cheap Yellow Display / CYD)
; Secondary: ESP32 DevKit V1 (serial-menu only) + ESP32-CAM

[platformio]
default_envs = cyd

[env]
platform = espressif32@^6.7.0
framework = arduino
monitor_speed = 115200
upload_speed = 921600
build_flags =
  -DCORE_DEBUG_LEVEL=1
  -DPWNDECK_VERSION=\"0.1.0\"
lib_deps =
  bodmer/TFT_eSPI@^2.5.43
  paulstoffregen/XPT2046_Touchscreen@^1.4
  bblanchon/ArduinoJson@^7.1.0
  loboris/ELECHOUSE_CC1101_SRC_DRV@^2.5.7

[env:cyd]
board = esp32-2432S028R
build_flags =
  ${env.build_flags}
  -DPWNDECK_TARGET_CYD=1
  -DUSER_SETUP_LOADED=1
  -DILI9341_2_DRIVER=1
  -DTFT_WIDTH=240
  -DTFT_HEIGHT=320
  -DTFT_MISO=12
  -DTFT_MOSI=13
  -DTFT_SCLK=14
  -DTFT_CS=15
  -DTFT_DC=2
  -DTFT_RST=-1
  -DTFT_BL=21
  -DTOUCH_CS=33
  -DSPI_FREQUENCY=55000000

[env:devkit]
board = esp32dev
build_flags =
  ${env.build_flags}
  -DPWNDECK_TARGET_DEVKIT=1

[env:cam]
board = esp32cam
build_flags =
  ${env.build_flags}
  -DPWNDECK_TARGET_CAM=1
